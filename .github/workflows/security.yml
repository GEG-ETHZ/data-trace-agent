name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Every Monday 09:00 UTC

# The GITHUB_TOKEN scope is otherwise whatever the org default is -- a setting held
# outside this repo, not versioned with it, and changeable without a commit. A
# permissions block replaces the scope set rather than adding to it, so this reduces a
# write-capable token to a read-only one. Widen per job, never here.
permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  dependency-audit:
    name: Dependency CVE Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          ignore-nothing-to-cache: true

      - run: uv sync

      - name: Audit dependencies
        run: uv run pip-audit --desc --format json --output pip-audit.json
        continue-on-error: false

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit.json

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned to a commit SHA, not a tag and never @main: this step runs with repository
      # read access in every generated project, so a moving ref means whatever is on that
      # branch at run time executes here. Dependabot's github-actions ecosystem bumps the
      # SHA and updates the comment.
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          # The action is a shell wrapper around `docker run "${IMAGE}:${VERSION}"`, and
          # VERSION defaults to `latest` -- so pinning the action SHA alone still pulls a
          # floating scanner image at run time. This pins what actually executes. Keep it
          # in step with the SHA above; goreleaser publishes the tag without the leading v.
          version: "3.97.5"
          extra_args: --only-verified
