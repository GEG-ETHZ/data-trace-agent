name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The GITHUB_TOKEN scope is otherwise whatever the org default is -- a setting held
# outside this repo, not versioned with it, and changeable without a commit. A
# permissions block replaces the scope set rather than adding to it, so this reduces a
# write-capable token to a read-only one. Widen per job, never here.
permissions:
  contents: read

jobs:
  lint-format-typecheck:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          ignore-nothing-to-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          ignore-nothing-to-cache: true

      - run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/unit -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
