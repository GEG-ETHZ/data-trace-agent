name: Deploy

# Manual only, deliberately. This previously fired on every push to main with no
# dependency on ci.yml, so a red build still deployed — against a live Agent Engine
# resource. It also forwarded none of the Git/DVC runtime variables below, so a
# CI-triggered deploy produced an agent that could not clone the registry, silently
# replacing a working deployment with a broken one.
#
# Re-enabling push-triggered CD needs three things first: the runtime secrets and
# variables below actually configured, a `dev` GitHub Environment to exist, and a
# `workflow_run` gate on ci.yml concluding successfully.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - prod
      ref:
        description: "Git ref to deploy (tag, branch or SHA). Empty deploys the current ref. Use a deployed-* tag to roll back."
        required: false
        type: string

# Nothing here writes through GITHUB_TOKEN: the GCP credential is a secret, not OIDC.
# Moving this workflow to Workload Identity Federation means adding `id-token: write`
# here -- without it, google-github-actions/auth fails to mint a token.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Agent Engine
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          ignore-nothing-to-cache: true

      - run: uv sync

      - name: Deploy
        run: uv run python deployment/deploy.py --env ${{ github.event.inputs.environment || 'prod' }}
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION }}
          GCS_STAGING_BUCKET: ${{ secrets.GCS_STAGING_BUCKET }}
          AGENT_ENGINE_RESOURCE_NAME: ${{ vars.AGENT_ENGINE_RESOURCE_NAME }}
          AGENT_ENGINE_SERVICE_ACCOUNT: ${{ vars.AGENT_ENGINE_SERVICE_ACCOUNT }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER || 'google' }}
          # Runtime configuration the agent needs to clone the registry and pull
          # DVC data. Omitting these does not fail the deploy — it produces an
          # agent that cannot reach its data. See runtime_env_vars() in
          # deployment/config.py for the full allowlist.
          REPO_URL: ${{ vars.REPO_URL }}
          GIT_AUTH_HOST: ${{ vars.GIT_AUTH_HOST }}
          GIT_AUTH_USERNAME: ${{ vars.GIT_AUTH_USERNAME }}
          # Secret Manager secret *names*, not values — config.py turns these into
          # SecretRefs. Alphanumeric and underscores only; Agent Engine rejects hyphens.
          GIT_AUTH_TOKEN_SECRET: ${{ vars.GIT_AUTH_TOKEN_SECRET }}
          DVC_CONFIG_LOCAL_SECRET: ${{ vars.DVC_CONFIG_LOCAL_SECRET }}

      - name: Write deployment summary
        if: success()
        run: |
          echo "## Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment:** ${{ github.event.inputs.environment || 'prod' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Ref:** ${{ github.event.inputs.ref || github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Resource:**" >> "$GITHUB_STEP_SUMMARY"
          cat .agent_engine_resource >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "N/A" >> "$GITHUB_STEP_SUMMARY"
