[project]
name = "data-trace-agent"
version = "0.1.0"
description = "An agent that links Git and DVC metadata with direct access to BigQuery and GCS to answer questions about the evolution and content of datasets."
authors = [
    {name = "Philipp Schädle", email = "philipp.schaedle@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pinned exactly, unlike the rest. deploy.py derives the container's requirements
    # from this list, and the agent is cloudpickled here and unpickled there: a version
    # difference between the two breaks at request time, not at deploy time. A floor of
    # >=1.0.0 let the container resolve 2.9.2 against a 2.2.0 pickle, and every request
    # died in LlmAgent.canonical_model with `'NoneType' object is not subscriptable`,
    # because the reconstructed model's pydantic private attributes were None.
    "google-adk==2.2.0",
    "google-cloud-aiplatform[agent_engines]>=1.90.0",
    "litellm>=1.50.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.44",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "dvc[all]>=3.0.0",
    "google-cloud-bigquery>=3.0.0",
    "db-dtypes>=1.0.0",
    # Declared explicitly although it also arrives transitively here. deploy.py derives
    # the container's requirements from this list, so a package that is only transitive
    # locally is not guaranteed to exist there -- and this one did not. observability.py
    # catches the ImportError and disables spans with a warning rather than failing, so
    # the only symptom was `make traces` staying empty on a working agent.
    "opentelemetry-exporter-gcp-trace>=1.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.0.0",
    "pre-commit>=3.7.0",
    "commitizen>=3.0.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N"]
# UP046/UP047 want PEP 695 generics (`def instrument[F](func: F) -> F`), which are 3.12+
# syntax. This project's sources come from a cookiecutter template that must also render
# and parse under Python 3.11, so they stay suppressed even when target-version is py312 —
# without this, generating with python_version=3.12 produces a project that fails its own
# `ruff check` on the first CI run. Safe to drop if you never intend to support 3.11.
ignore = ["E501", "UP046", "UP047"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Covers deployment/ as well as agent/. deploy.py ships the pickled agent to production and
# is the highest-blast-radius code here, so it belongs under the gate rather than outside it.
addopts = "--cov=agent --cov=deployment --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.report]
exclude_also = [
    # argparse entry points in deploy.py / health_check.py. No import-based test can reach
    # these, so counting them only depresses the number without saying anything useful.
    "if __name__ == .__main__.:",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "semver"
tag_format = "v$version"
# Read and write [project].version rather than carrying a second copy here; without a
# provider, `cz bump` has no source of truth to read.
version_provider = "pep621"
update_changelog_on_bump = true
changelog_incremental = true
